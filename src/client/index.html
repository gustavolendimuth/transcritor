<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Transcritor</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap"
    />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div id="boot-loading" class="boot-loading" role="status" aria-live="polite">
      <span class="spinner spinner-lg" aria-hidden="true"></span>
    </div>

    <div id="login-backdrop" class="backdrop" hidden>
      <form id="login-form" class="modal" novalidate>
        <div class="waveform" aria-hidden="true">
          <span></span><span></span><span></span><span></span><span></span>
        </div>
        <h1 class="modal-title">Transcritor</h1>
        <p class="modal-subtitle">Entre para continuar</p>
        <label class="field">
          <span>Usuário</span>
          <input id="login-user" type="text" autocomplete="username" required />
        </label>
        <label class="field">
          <span>Senha</span>
          <input id="login-password" type="password" autocomplete="current-password" required />
        </label>
        <p id="login-error" class="error" role="alert" hidden></p>
        <button id="login-submit-btn" type="submit" class="btn btn-primary">
          <span class="btn-label">Entrar</span>
          <span class="spinner btn-spinner" aria-hidden="true"></span>
        </button>
      </form>
    </div>

    <div id="app" hidden>
      <header class="app-header">
        <div class="brand">
          <div class="waveform" aria-hidden="true">
            <span></span><span></span><span></span><span></span><span></span>
          </div>
          <h1>Transcritor</h1>
        </div>
        <button id="logout-btn" type="button" class="btn btn-ghost">Sair</button>
      </header>

      <main>
        <section id="upload-section" class="card">
          <label id="drop-zone" for="file-input" class="dropzone">
            <svg
              class="dropzone-icon dropzone-icon-upload"
              width="32"
              height="32"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.5"
              aria-hidden="true"
            >
              <path d="M12 16V4M12 4l-4 4M12 4l4 4" stroke-linecap="round" stroke-linejoin="round" />
              <path
                d="M4 16v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
            <svg
              class="dropzone-icon dropzone-icon-check"
              width="32"
              height="32"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.5"
              aria-hidden="true"
            >
              <path d="m5 13 4 4L19 7" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
            <span class="dropzone-prompt">Arraste áudios ou vídeos aqui ou clique para escolher</span>
            <span class="dropzone-file">
              <span id="dropzone-filename" class="dropzone-filename"></span>
              <small>Clique para trocar o arquivo</small>
            </span>
            <input id="file-input" type="file" accept="audio/*,video/*" multiple hidden />
          </label>
          <p>
            Em vídeos, somente o áudio é extraído. Dependendo do tamanho do arquivo, o upload e a transcrição podem demorar alguns minutos.
          </p>
          <div class="upload-options">
            <label class="checkbox-field">
              <input id="timestamps-checkbox" type="checkbox" />
              <span>
                Adicionar tempo às falas
                <small
                  >Adiciona o tempo de cada trecho falado ao texto. Isso usa outro modelo de
                  transcrição e pode reduzir um pouco a qualidade — se notar isso, tente
                  novamente sem marcar esta opção.</small
                >
              </span>
            </label>
            <label class="field field-inline">
              <span>Idioma</span>
              <select id="language-select"></select>
            </label>
            <label class="field">
              <span>Tag</span>
              <div class="tag-combobox">
                <span id="upload-project-tag-dot" class="tag-dot tag-combobox-dot" aria-hidden="true"></span>
                <input
                  id="upload-project-tag"
                  type="text"
                  class="tag-combobox-input"
                  placeholder="Ex.: Cliente Acme"
                  autocomplete="off"
                  role="combobox"
                  aria-expanded="false"
                  aria-autocomplete="list"
                  aria-controls="upload-project-tag-listbox"
                />
                <ul id="upload-project-tag-listbox" class="tag-combobox-popover" role="listbox" hidden></ul>
              </div>
            </label>
          </div>
          <button id="transcribe-btn" type="button" class="btn btn-primary" disabled>
            Transcrever
          </button>
          <ul id="upload-queue" class="upload-queue" aria-live="polite" hidden></ul>
        </section>

        <section id="result-section" class="card" hidden>
          <h2>Resultado</h2>
          <label class="field result-filename-field">
            <span>Nome da transcrição</span>
            <input id="result-filename" type="text" />
          </label>
          <label class="field result-project-field">
            <span>Tag</span>
            <div class="tag-combobox">
              <span id="result-project-tag-dot" class="tag-dot tag-combobox-dot" aria-hidden="true"></span>
              <input
                id="result-project-tag"
                type="text"
                class="tag-combobox-input"
                placeholder="Sem tag"
                autocomplete="off"
                role="combobox"
                aria-expanded="false"
                aria-autocomplete="list"
                aria-controls="result-project-tag-listbox"
              />
              <ul id="result-project-tag-listbox" class="tag-combobox-popover" role="listbox" hidden></ul>
            </div>
          </label>
          <div class="editor">
            <div class="editor-toolbar">
              <label class="editor-label" for="result-text">
                <svg
                  class="editor-pencil"
                  width="14"
                  height="14"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.75"
                  aria-hidden="true"
                >
                  <path
                    d="m16.5 3.5 4 4L7 21l-4.5 1L3.5 17.5Z"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  />
                </svg>
                Transcrição
              </label>
              <span id="result-text-count" class="editor-count"></span>
            </div>
            <textarea
              id="result-text"
              class="result-text"
              placeholder="Edite o texto da transcrição aqui…"
            ></textarea>
          </div>
          <div class="actions">
            <button id="copy-btn" type="button" class="btn btn-secondary">Copiar</button>
            <button id="download-btn" type="button" class="btn btn-secondary">Baixar</button>
          </div>
        </section>

        <section id="history-section" class="card">
          <div class="section-heading">
            <h2>
              Histórico
              <span id="history-loading" class="spinner spinner-sm" aria-hidden="true" hidden></span>
            </h2>
            <div class="tag-filter">
              <span class="tag-filter-label">Tags</span>
              <div id="history-project-filter" class="tag-filter-row" role="group" aria-label="Filtrar por tag"></div>
            </div>
          </div>
          <p id="history-empty" class="empty-state" hidden>
            Nenhuma transcrição ainda — envie um áudio acima para começar.
          </p>
          <ul id="history-list"></ul>
        </section>
      </main>
    </div>

    <div id="alert-backdrop" class="backdrop" hidden>
      <div id="alert-modal" class="modal alert-modal" role="alertdialog" aria-live="assertive">
        <svg
          class="alert-icon alert-icon-success"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.5"
          aria-hidden="true"
        >
          <circle cx="12" cy="12" r="9" />
          <path d="m8 12.5 2.5 2.5L16 9" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
        <svg
          class="alert-icon alert-icon-error"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.5"
          aria-hidden="true"
        >
          <circle cx="12" cy="12" r="9" />
          <path d="M12 7.5v5.5" stroke-linecap="round" />
          <circle cx="12" cy="16.25" r="0.75" fill="currentColor" stroke="none" />
        </svg>
        <p id="alert-message" class="alert-message"></p>
        <div class="alert-actions">
          <button id="alert-retry-btn" type="button" class="btn btn-primary" hidden>Tentar novamente</button>
          <button id="alert-ok-btn" type="button" class="btn btn-primary">OK</button>
        </div>
      </div>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
