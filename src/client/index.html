<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Transcritor</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap"
    />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div id="login-backdrop" class="backdrop" hidden>
      <form id="login-form" class="modal" novalidate>
        <div class="waveform" aria-hidden="true">
          <span></span><span></span><span></span><span></span><span></span>
        </div>
        <h1 class="modal-title">Transcritor</h1>
        <p class="modal-subtitle">Entre para continuar</p>
        <label class="field">
          <span>Usuário</span>
          <input id="login-user" type="text" autocomplete="username" required />
        </label>
        <label class="field">
          <span>Senha</span>
          <input id="login-password" type="password" autocomplete="current-password" required />
        </label>
        <p id="login-error" class="error" role="alert" hidden></p>
        <button type="submit" class="btn btn-primary">Entrar</button>
      </form>
    </div>

    <div id="app" hidden>
      <header class="app-header">
        <div class="brand">
          <div class="waveform" aria-hidden="true">
            <span></span><span></span><span></span><span></span><span></span>
          </div>
          <h1>Transcritor</h1>
        </div>
        <button id="logout-btn" type="button" class="btn btn-ghost">Sair</button>
      </header>

      <main>
        <section id="upload-section" class="card">
          <label id="drop-zone" for="file-input" class="dropzone">
            <svg
              class="dropzone-icon dropzone-icon-upload"
              width="32"
              height="32"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.5"
              aria-hidden="true"
            >
              <path d="M12 16V4M12 4l-4 4M12 4l4 4" stroke-linecap="round" stroke-linejoin="round" />
              <path
                d="M4 16v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
            <svg
              class="dropzone-icon dropzone-icon-check"
              width="32"
              height="32"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.5"
              aria-hidden="true"
            >
              <path d="m5 13 4 4L19 7" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
            <span class="dropzone-prompt">Arraste um áudio aqui ou clique para escolher</span>
            <span class="dropzone-file">
              <span id="dropzone-filename" class="dropzone-filename"></span>
              <small>Clique para trocar o arquivo</small>
            </span>
            <input id="file-input" type="file" accept="audio/*" hidden />
          </label>
          <div class="upload-options">
            <label class="checkbox-field">
              <input id="timestamps-checkbox" type="checkbox" />
              <span>
                Adicionar tempo às falas
                <small
                  >Adiciona o tempo de cada trecho falado ao texto. Isso usa outro modelo de
                  transcrição e pode reduzir um pouco a qualidade — se notar isso, tente
                  novamente sem marcar esta opção.</small
                >
              </span>
            </label>
            <label class="field field-inline">
              <span>Idioma</span>
              <select id="language-select"></select>
            </label>
          </div>
          <button id="transcribe-btn" type="button" class="btn btn-primary" disabled>
            <span class="btn-label">Transcrever</span>
            <span class="waveform waveform-btn" aria-hidden="true">
              <span></span><span></span><span></span><span></span><span></span>
            </span>
          </button>
          <p id="status" class="status"></p>
        </section>

        <section id="result-section" class="card" hidden>
          <h2>Resultado</h2>
          <textarea id="result-text" class="result-text" readonly></textarea>
          <div class="actions">
            <button id="copy-btn" type="button" class="btn btn-secondary">Copiar</button>
            <button id="download-btn" type="button" class="btn btn-secondary">Baixar</button>
          </div>
        </section>

        <section id="history-section" class="card">
          <h2>Histórico</h2>
          <p id="history-empty" class="empty-state" hidden>
            Nenhuma transcrição ainda — envie um áudio acima para começar.
          </p>
          <ul id="history-list"></ul>
        </section>
      </main>
    </div>

    <div id="loading-backdrop" class="backdrop" hidden>
      <div class="modal loading-modal" role="status" aria-live="polite">
        <span class="spinner spinner-lg" aria-hidden="true"></span>
        <p class="loading-message">
          Transcrevendo... isso pode levar alguns minutos para áudios longos.
        </p>
      </div>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
